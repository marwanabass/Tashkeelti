<style>

 --cut:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px))}
body{background:var(--bg);color:#eef1f6;font-family:Cairo,system-ui,sans-serif;min-height:100vh;
 background-image:radial-gradient(900px 340px at 85% -120px,rgba(52,211,153,.07),transparent),radial-gradient(800px 340px at 5% -120px,rgba(31,178,122,.07),transparent)}
.d{font-family:'Barlow Condensed',Impact,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase}
.btn{font-weight:700;padding:.6rem 1.1rem;border-radius:.75rem;transition:transform .15s,box-shadow .2s;white-space:nowrap;cursor:pointer;border:0}
.btn:focus-visible,.chip:focus-visible,.f:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.neon{background:var(--neon);color:#04170f}.neon:hover{box-shadow:0 6px 18px rgba(52,211,153,.28);transform:translateY(-1px)}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#04170f}.gold:hover{box-shadow:0 6px 18px rgba(31,178,122,.28);transform:translateY(-1px)}
.ghost{background:var(--s2);border:1px solid var(--line)}.ghost:hover{border-color:var(--gold)}
.f{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:.6rem;padding:.6rem .8rem;color:inherit;font:inherit}
.f:focus{outline:0;border-color:var(--neon);box-shadow:0 0 0 3px rgba(52,211,153,.18)}

dialog{background:var(--s1);color:#eef1f6;border:1px solid var(--line);border-radius:1.1rem;padding:0;width:min(480px,94vw);max-height:92vh;box-shadow:0 20px 70px rgba(0,0,0,.65)}
.vb{color:var(--blue);font-size:.95em;margin-inline-start:.3rem;filter:drop-shadow(0 0 4px rgba(74,163,255,.45))}
.lk.on{color:#ff7a93;border-color:#ff7a93}
.ic{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.17em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.solid path{fill:currentColor}.ic-badge circle{fill:currentColor;stroke:none}.ic-badge path{stroke:#fff}.ic-crown{fill:rgba(255,255,255,.18)}
dialog::backdrop{background:rgba(0,0,0,.82)}
dialog form,dialog .box{padding:1.3rem;display:grid;gap:.9rem}
label.l{display:block;font-size:.78rem;color:var(--mute);margin-bottom:.2rem}
.err{color:#ff8b8b;font-size:.85rem;min-height:1.1rem}
#toast{position:fixed;inset-inline:0;margin:auto;width:max-content;bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--neon);color:#031a0d;font-weight:700;padding:.6rem 1.4rem;border-radius:.75rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== v3: mobile-first layout, calm luxury cards ===== */
.hidden{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:rgba(7,10,9,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:10px 0}
.logo{order:0;font-size:30px;line-height:1;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{order:2;flex:1}#langBtn{order:3}#auth{order:4;display:flex;align-items:center;gap:8px}
.sr{order:5;flex:1 1 100%;position:relative;display:block}
.sr .ic{position:absolute;top:50%;inset-inline-start:15px;transform:translateY(-50%);color:var(--mute);pointer-events:none}
.sr input{padding:.7rem 1rem;padding-inline-start:42px;border-radius:999px;background:#0b110f}
.btn{min-height:42px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.sm{padding:.45rem .9rem;min-height:40px}
.av.me{width:40px;height:40px;border:0;cursor:pointer;font-size:15px}
.hero{position:relative;padding:26px 0 6px}
.hp{position:absolute;inset-inline-end:-30px;top:0;width:290px;opacity:.11;stroke:var(--neon);fill:none;stroke-width:1.5;pointer-events:none}
.hero h1{position:relative;font-size:clamp(40px,10vw,72px);line-height:.95}
.hero em{font-style:inherit;color:var(--neon)}
.sub{position:relative;color:var(--mute);margin-top:12px;max-width:540px}
.stats{position:relative;display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:16px;padding:8px 16px;display:flex;align-items:baseline;gap:8px}
.stat b{font-size:28px;line-height:1;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{color:var(--mute);font-size:13px}
.banner{margin-top:14px;border:1px solid #1f5a41;background:#0d2a1f;color:#bdf3d9;border-radius:12px;padding:10px 14px;font-size:14px}
.rail{display:flex;gap:8px;overflow-x:auto;padding:16px 0 10px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.chip{flex:none}.chip.more{color:var(--gold2);border-color:rgba(31,178,122,.5)}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 0 14px;color:var(--mute);font-size:14px}
.sortb{display:flex;align-items:center;gap:8px}.sortb select{width:auto;min-width:130px;padding:.45rem .8rem}
#grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr));padding-bottom:120px}
.card{border-radius:22px;background:linear-gradient(180deg,#101a16,#0a100e);border:1px solid var(--line);overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}
.card.up{animation:up .55s cubic-bezier(.2,.7,.2,1) both}
.card:hover{transform:translateY(-3px);border-color:rgba(52,211,153,.4);box-shadow:0 18px 40px rgba(0,0,0,.5)}
.shot{position:relative;display:block;width:100%;aspect-ratio:16/11;background:#07130d;border:0;padding:0;cursor:zoom-in;overflow:hidden}
.shot>img,.shot>svg{width:100%;height:100%;object-fit:cover;object-position:top;display:block;transition:transform .5s}
.card:hover .shot>img{transform:scale(1.04)}
.shot::after{content:"";position:absolute;inset:auto 0 0;height:50%;background:linear-gradient(transparent,#0a100e);pointer-events:none}
.fm{position:absolute;z-index:2;top:12px;inset-inline-start:12px;padding:3px 14px;font-size:22px;line-height:1.2;border-radius:999px;background:rgba(7,10,9,.72);border:1px solid rgba(52,211,153,.55);color:var(--neon);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.zoom{position:absolute;z-index:2;inset-inline-end:10px;top:12px;background:rgba(7,10,9,.6);border-radius:10px;padding:5px 8px;font-size:13px;color:#fff}
.cb{position:relative;z-index:2;margin-top:-30px;padding:0 16px 16px;display:flex;flex-direction:column;gap:12px}
.ur{display:flex;align-items:center;justify-content:space-between;gap:10px}
.u{display:flex;align-items:center;gap:10px;min-width:0;background:none;border:0;color:inherit;cursor:pointer;text-align:start;padding:0;font:inherit}
.u .av{width:40px;height:40px;font-size:15px;box-shadow:0 0 0 2px #0a100e,0 0 0 3.5px var(--neon)}
.ui{display:flex;flex-direction:column;min-width:0}
.un{font-weight:700;direction:ltr;text-align:start;display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.dn{font-size:12px;color:var(--mute);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ag{color:var(--mute);font-size:12px;white-space:nowrap}
.tk{display:flex;align-items:center;gap:10px;background:#070b09;border:1px dashed #2f4a3f;border-radius:14px;padding:11px 14px;color:var(--mute)}
.tk span{font:600 15px ui-monospace,Menlo,monospace;color:var(--gold2);direction:ltr;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.04em}
.ac{display:flex;gap:8px}.ac .cp{flex:1}
.empty{grid-column:1/-1;text-align:center;padding:56px 12px;border:1px dashed var(--line);border-radius:20px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{font-size:34px}.empty b{color:#fff;font-size:30px}
.sk{height:330px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(100deg,#0d1311 30%,#16211c 50%,#0d1311 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
.fab{position:fixed;z-index:15;inset-inline-end:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font-size:22px;color:#04170f;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 12px 30px rgba(31,178,122,.4);transition:transform .2s}
.fab:hover{transform:scale(1.07)}.fab:active{transform:scale(.95)}
#fDlg{width:min(720px,96vw)}
.fh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.fb{overflow:auto;max-height:70vh;padding:4px 18px 22px}
.gh{margin:18px 0 10px;color:var(--gold2);font-size:20px}
.fg{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.ft{background:var(--s2);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;color:inherit;text-align:center;transition:border-color .15s,transform .15s}
.ft:hover{border-color:var(--neon);transform:translateY(-2px)}.ft.on{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon)}
.ft svg{width:100%;aspect-ratio:16/10;display:block;border-radius:8px;margin-bottom:6px}.ft span{font-size:15px;line-height:1.1;display:block}
@keyframes up{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes sh{to{background-position:-200% 0}}
@media(max-width:559px){.lb{display:none}}
@media(max-width:759px){.hm{display:none}}
@media(min-width:760px){.sr{order:1;flex:1 1 360px;max-width:520px;margin-inline:auto}.sp{display:none}.fab{display:none}}
@media(prefers-reduced-motion:reduce){.card.up,.sk{animation:none}}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.tab{border:0;background:none;color:var(--mute);padding:.65rem;border-radius:10px;font:700 1rem Cairo,sans-serif;cursor:pointer;transition:all .15s}
.tab.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#04170f}
.hint{font-size:.8rem;color:var(--mute)}
.pf{display:flex;flex-direction:column;gap:14px;padding:20px 0 10px;align-items:flex-start}
.pfh{display:flex;align-items:center;gap:16px}
.av.big{width:78px;height:78px;font-size:32px;box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--neon)}
.pfn{font-size:34px;line-height:1;direction:ltr;display:flex;align-items:center}
.sk-av{display:block;width:40px;height:40px;border-radius:50%;background:linear-gradient(100deg,#0d1311 30%,#16211c 50%,#0d1311 70%);background-size:200% 100%;animation:sh 1.3s linear infinite}
.more{grid-column:1/-1;text-align:center;padding:6px 0 10px}

async function firebaseStore(cfg){

  let cb=()=>{},busy=false;
  const mail=h=>h+'@'+AUTH_DOMAIN;

    if(busy)return;
    if(!u)return cb(null);
    let d={};try{const s=await F.getDoc(F.doc(fs,'users',u.uid));d=s.exists()?s.data():{}}catch(e){console.error(e);toast(t('ePerm'),7000)}

    async signIn(h,pw){await A.signInWithEmailAndPassword(auth,mail(h),pw)},
    async signUp(h,pw){
      busy=true;
      try{const u=(await A.createUserWithEmailAndPassword(auth,mail(h),pw)).user;
        try{const b=F.writeBatch(fs);b.set(F.doc(fs,'handles',h),{uid:u.uid,isVerified:false});b.set(F.doc(fs,'users',u.uid),{handle:h,displayName:h,bio:''});await b.commit()}
        catch(e){console.error(e);await A.deleteUser(u).catch(()=>{});throw new Error('taken')}}

    logout:()=>A.signOut(auth),

    async profile(h){const s=await F.getDocs(F.query(F.collection(fs,'users'),F.where('handle','==',h),F.limit(1)));return s.empty?null:s.docs[0].data()},
    async fullImage(id){const s=await F.getDoc(F.doc(fs,'images',id));return s.exists()?s.data().data:null},
    async stats(){try{const [a,b]=await Promise.all([F.getCountFromServer(F.collection(fs,'tactics')),F.getCountFromServer(F.collection(fs,'handles'))]);return{t:a.data().count,c:b.data().count}}catch(e){return null}},
    subscribeVerified(f){F.onSnapshot(F.query(F.collection(fs,'handles'),F.where('isVerified','==',true)),s=>f(new Set(s.docs.map(d=>d.id))))},
    async add(p){ // small thumbnail goes in the feed document; the full image is stored apart and loaded only when opened

      b.set(tr,{...d,likeCount:0,at:F.serverTimestamp()});if(full)b.set(F.doc(fs,'images',tr.id),{uid:p.uid,data:full});await b.commit()},
    async remove(id){await F.deleteDoc(F.doc(fs,'tactics',id));F.deleteDoc(F.doc(fs,'images',id)).catch(()=>{})},
    async toggleLike(u,p,on){const b=F.writeBatch(fs),lr=F.doc(fs,'likes',p.id+'_'+u.uid),tr=F.doc(fs,'tactics',p.id);

  $('sT').textContent=statsN?statsN.t:posts.length;$('sC').textContent=statsN?statsN.c:new Set(posts.map(p=>p.handle)).size;$('sF').textContent=FORMATIONS.length;
  $('count').textContent=`${l.length} ${t('nTac')}`;
  if(view)renderProfile();
  if(src===null||(!view&&!loaded)){
    $('grid').innerHTML=loadErr?`<div class="empty"><i class="fa-solid fa-ban"></i><b class="d">${t('eConn')}</b><span>${t('eConnSub')}</span><button class="btn neon" id="retry">${t('retry')}</button></div>`:'<div class="sk"></div>'.repeat(4);return}
  const more=!view&&posts.length>=feedLimit&&!q&&!fFilter?`<div class="more"><button class="btn ghost" id="moreFeed">${t('loadMore')}</button></div>`:'';
  $('grid').innerHTML=(l.length?l.map((p,i)=>`<article class="card${anim?' up':''}" style="${anim?`animation-delay:${Math.min(i,8)*55}ms`:''}">
    <button class="shot" data-img="${esc(p.id)}" aria-label="View">${okImg(p.img)?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(p.img)}" alt="${esc(p.formation)}">`:pitch(p.formation)}<span class="fm d">${esc(p.formation)}</span><span class="zoom"><i class="fa-solid fa-expand"></i></span></button>
    <div class="cb">
      <div class="ur"><button class="u" data-user="${esc(p.handle)}"><span class="av">${esc(p.handle[0].toUpperCase())}</span><span class="ui"><span class="un">@${esc(p.handle)}${verified.has(p.handle)?`<i class="fa-solid fa-circle-check vb" title="${t('verified')}"></i>`:''}</span>${p.displayName?`<span class="dn">${esc(p.displayName)}</span>`:''}</span></button>
        <span class="ag"><i class="fa-regular fa-clock"></i> ${ago(p.at)}</span></div>
      <div class="tk"><i class="fa-solid fa-key"></i><span>${esc(p.code)}</span></div>
      <div class="ac"><button class="btn neon cp" data-copy="${esc(p.id)}"><i class="fa-regular fa-copy"></i> ${t('copy')}</button>
        <button class="btn ghost lk ${myLikes.has(p.id)?'on':''}" data-like="${esc(p.id)}" aria-pressed="${myLikes.has(p.id)}" aria-label="Like"><i class="fa-${myLikes.has(p.id)?'solid':'regular'} fa-heart"></i> ${p.likeCount||0}</button>
        ${me&&(p.uid===me.uid||me.isAdmin)?`<button class="btn ghost" data-del="${esc(p.id)}" aria-label="Delete"><i class="fa-solid fa-trash"></i></button>`:''}</div>
    </div></article>`).join('')
  :`<div class="empty"><i class="fa-solid fa-futbol"></i><b class="d">${t('none')}</b><span>${t(view&&me&&me.handle===view?'noneMine':'noneSub')}</span></div>`)+more;
  anim=false;
}
function renderRail(){
  const L=[...POP];if(fFilter&&!L.includes(fFilter))L.unshift(fFilter);
  $('rail').innerHTML=`<button class="chip d ${fFilter?'':'on'}" data-f=""><i class="fa-solid fa-layer-group"></i> ${t('all')}</button>`
   +L.map(f=>`<button class="chip d ${f===fFilter?'on':''}" data-f="${esc(f)}">${esc(f)}</button>`).join('')
   +`<button class="chip d more" id="moreBtn"><i class="fa-solid fa-diagram-project"></i> ${t('allF')} · ${FORMATIONS.length}</button>`}
// Full formation picker: every formation with a mini pitch, grouped by number of defenders
function renderSheet(){
  const g={};FORMATIONS.forEach(f=>(g[f[0]]=g[f[0]]||[]).push(f));
  $('fBody').innerHTML=Object.keys(g).sort().map(n=>`<h3 class="gh d">${n} ${t('defs')}</h3><div class="fg">${g[n].map(f=>`<button class="ft ${f===fFilter?'on':''}" data-ft="${esc(f)}">${pitch(f)}<span class="d">${esc(f)}</span></button>`).join('')}</div>`).join('')}
let authMode='in';
function setMode(m){authMode=m;$('tIn').classList.toggle('on',m==='in');$('tUp').classList.toggle('on',m==='up');
  $('aGo').innerHTML=`<i class="fa-solid fa-user-pen"></i> ${t(m==='up'?'signup':'signinS')}`;
  $('aP').autocomplete=m==='up'?'new-password':'current-password';$('aNote').classList.toggle('hidden',m!=='up');$('aE').textContent=''}
function openAuth(m){setMode(m);$('aDlg').showModal();$('aU').focus()}
function renderAuth(){
  if(!authReady){$('auth').innerHTML='<span class="sk-av"></span>';return}
  $('auth').innerHTML=me?`${me.isAdmin?`<button class="btn gold sm" id="adBtn" title="${t('admin')}"><i class="fa-solid fa-crown"></i><span class="lb">${t('admin')}</span></button>`:''}
    <button class="btn gold sm hm" id="newBtn"><i class="fa-solid fa-plus"></i><span class="lb">${t('share')}</span></button>
    <button class="av me" id="meBtn" aria-label="${t('profile')}">${me.photo?`<img src="${esc(me.photo)}" alt="">`:esc((me.handle||me.displayName||'?')[0].toUpperCase())}</button>`
    :`<button class="btn gold sm" id="inBtn"><i class="fa-solid fa-user-pen"></i><span>${t('signinS')}</span></button>`}
// ---- Profile pages: #/u/<handle> shows that creator and all of their tactics (works with refresh + back button) ----
function renderProfile(){
  if(!view)return;
  const i=profInfo||{},own=me&&me.handle===view,l=userPosts||[],likes=l.reduce((a,p)=>a+(p.likeCount||0),0);
  $('profile').innerHTML=`<div class="pf"><button class="btn ghost sm" data-back><i class="fa-solid fa-xmark"></i> ${t('back')}</button>
   <div class="pfh"><span class="av big">${esc(view[0].toUpperCase())}</span><div class="ui"><div class="pfn d">@${esc(view)}${verified.has(view)?`<i class="fa-solid fa-circle-check vb" title="${t('verified')}"></i>`:''}</div>${i.displayName&&i.displayName!==view?`<div class="dn">${esc(i.displayName)}</div>`:''}</div></div>
   ${i.bio?`<p class="sub">${esc(i.bio)}</p>`:''}
   <div class="stats"><div class="stat"><b>${l.length}</b><span>${t('sTac')}</span></div><div class="stat"><b>${likes}</b><span>${t('likes')}</span></div></div>
   ${own?`<div class="ac"><button class="btn gold" id="editPf"><i class="fa-solid fa-pen"></i> ${t('edit')}</button><button class="btn ghost" data-out><i class="fa-solid fa-right-from-bracket"></i> ${t('signout')}</button></div>`:''}</div>`}
function route(){
  const m=location.hash.match(/^#\/u\/([A-Za-z0-9_]{3,16})$/);view=m?m[1].toLowerCase():'';
  unUser();unUser=()=>{};userPosts=null;profInfo=null;
  document.title=view?'@'+view+' · Tashkeelti':'Tashkeelti | تشكيلتي';
  $('hero').classList.toggle('hidden',!!view);$('rail').classList.toggle('hidden',!!view);$('profile').classList.toggle('hidden',!view);
  if(view&&store){const h=view;
    unUser=store.byHandle(h,l=>{userPosts=l;render()},e=>{console.error(e);loadErr=true;render()})||(()=>{});
    store.profile(h).then(i=>{if(view===h){profInfo=i||{};renderProfile()}}).catch(()=>{if(view===h){profInfo={};renderProfile()}})}
  scrollTo(0,0);render()}
function startFeed(){unFeed();unFeed=store.subscribe(l=>{posts=l;loaded=true;loadErr=false;render()},feedLimit,e=>{console.error(e);loadErr=true;render()})||(()=>{})}
async function refreshStats(){try{statsN=await store.stats();render()}catch(e){}}
function applyLang(){ // swap text + flip page direction (RTL for Arabic)
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';localStorage.setItem('tk_lang',lang);
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  $('langBtn').innerHTML='<i class="fa-solid fa-globe"></i> '+(lang==='ar'?'EN':'عربي');
  if(store&&store.demo){$('banner').textContent=t('demo')}
  setMode(authMode);renderAuth();renderRail();render()}

/* ---------------- Events ---------------- */
const openProfile=()=>{$('prH').value=me.handle||'';$('prH').disabled=!!me.handle;$('prH').required=!me.handle;$('prN').value=me.displayName;$('prB').value=me.bio;$('prE').textContent='';$('prDlg').showModal()};
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;if(!store&&b.id!=='langBtn'&&b.id!=='retry')return;
  if(b.id==='langBtn'){lang=lang==='ar'?'en':'ar';applyLang()}
  else if(b.id==='inBtn')openAuth('in');
  else if(b.dataset.mode)setMode(b.dataset.mode);
  else if(b.id==='moreFeed'){feedLimit+=18;startFeed()}
  else if(b.id==='retry')location.reload();
  else if(b.id==='editPf')openProfile();
  else if(b.dataset.back!==undefined)location.hash='';
  else if(b.id==='moreBtn'){renderSheet();$('fDlg').showModal()}
  else if(b.id==='fClose')$('fDlg').close();
  else if(b.dataset.ft!==undefined){fFilter=b.dataset.ft;anim=true;$('fDlg').close();renderRail();render();scrollTo({top:0,behavior:'smooth'})}
  else if(b.id==='meBtn'){me.handle?location.hash='#/u/'+me.handle:openProfile()}
  else if(b.id==='outBtn'||b.dataset.out!==undefined){$('prDlg').close();location.hash='';store.logout()}   // sign out immediately, no confirmation
  else if(b.id==='newBtn'||b.id==='fab'){if(!me)return openAuth('up');if(me.handle)$('pDlg').showModal()}
  else if(b.id==='adBtn'){$('adE').textContent='';$('adDlg').showModal()}
  else if(b.closest('#rail')){fFilter=b.dataset.f;anim=true;renderRail();render()}
  else if(b.dataset.user)location.hash='#/u/'+b.dataset.user;
  else if(b.dataset.copy){const p=byId(b.dataset.copy),ok=await copy(p.code),old=b.innerHTML;b.textContent=ok?t('copied'):t('failed');setTimeout(()=>b.innerHTML=old,1500);if(ok){navigator.vibrate&&navigator.vibrate(18);toast(t('copyDone'))}}
  else if(b.dataset.like){if(!me)return toast(t('loginLike'));const p=byId(b.dataset.like);try{await store.toggleLike(me,p,!myLikes.has(p.id))}catch(x){toast(t('failed'))}}
  else if(b.dataset.del){if(confirm(t('del')))store.remove(b.dataset.del)}
  else if(b.dataset.img){const p=byId(b.dataset.img);if(p&&okImg(p.img)){const im=$('big').querySelector('img');im.src=p.img;$('big').showModal();
    store.fullImage(p.id).then(d=>{if(d&&okImg(d)&&$('big').open)im.src=d}).catch(()=>{})}}  // thumbnail first, sharp version loads on demand
});
$('big').onclick=()=>$('big').close();$('fDlg').addEventListener('click',e=>{if(e.target===$('fDlg'))$('fDlg').close()});$('q').oninput=render;$('sort').onchange=render;$('aForm').onsubmit=async e=>{e.preventDefault();$('aE').textContent='';
  const h=$('aU').value.trim().replace(/^@/,'').toLowerCase(),pw=$('aP').value;
  if(!/^[a-z0-9_]{3,16}$/.test(h)){$('aE').textContent=t('bad');return}
  if(pw.length<6){$('aE').textContent=t('ePw');return}
  const g=$('aGo');g.disabled=true;
  try{await(authMode==='up'?store.signUp(h,pw):store.signIn(h,pw));$('aDlg').close();$('aForm').reset()}
  catch(x){console.error(x);$('aE').textContent=authMsg(x)}
  g.disabled=false};
$('pCancel').onclick=()=>$('pDlg').close();
$('prForm').onsubmit=async e=>{e.preventDefault();$('prE').textContent='';
  const h=$('prH').value.replace(/^@/,'');if(!me.handle&&!/^[A-Za-z0-9_]{3,16}$/.test(h)){$('prE').textContent=t('bad');return}
  try{const had=!!me.handle;await store.saveProfile(me,{handle:h,displayName:$('prN').value.trim(),bio:$('prB').value.trim()});$('prDlg').close();if(!had)$('pDlg').showModal()}
  catch(x){$('prE').textContent=t(x.message)==x.message?t('failed'):t(x.message)}};
// Compress uploads to a small JPEG data URL (stored directly in Firestore — no Storage plan needed)
const shrink=(f,w=900,q=.72)=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,w/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',q))};im.onerror=no;im.src=URL.createObjectURL(f)});
$('pForm').onsubmit=async e=>{e.preventDefault();const g=$('pGo');g.disabled=true;$('pE').textContent='';
  try{if(Date.now()-(+localStorage.getItem('tk_last')||0)<30000)throw new Error('wait');
    const f=$('pI').files[0],u=$('pU').value.trim();let img,full;
    if(f){[img,full]=await Promise.all([shrink(f,520,.62),shrink(f,1000,.72)])}else img=u;
    if(!/^(data:image\/|https:\/\/)/.test(img))throw new Error('needImg');if(img.length>150000||(full&&full.length>800000))throw new Error('big');
    await store.add({uid:me.uid,handle:me.handle,displayName:me.displayName,formation:$('pF').value.trim(),code:$('pC').value.trim(),img,full});
    try{localStorage.setItem('tk_last',Date.now())}catch(_){}
    $('pForm').reset();$('pDlg').close();toast(t('done'));refreshStats()}
  catch(x){$('pE').textContent=t(x.message)==x.message?t('failed'):t(x.message)}g.disabled=false};
for(const [id,v] of [['grant',true],['revoke',false]])$(id).onclick=async()=>{$('adE').textContent='';
  try{await store.setVerified($('adH').value.trim().replace(/^@/,''),v);toast(t('done'))}catch(x){$('adE').textContent=t(x.message)==x.message?t('failed'):t(x.message)}};

/* ---------------- Boot ---------------- */
$('pF').innerHTML=FORMATIONS.map(f=>`<option>${f}</option>`).join('');
const live=!FIREBASE_CONFIG.apiKey.startsWith('YOUR');
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),ms))]);
addEventListener('hashchange',route);
addEventListener('offline',()=>toast(t('offline'),4000));addEventListener('online',()=>toast(t('online')));
route();applyLang();   // paint the page immediately — never wait for the network
(async()=>{
  try{store=await withTimeout(live?firebaseStore(FIREBASE_CONFIG):Promise.resolve(demoStore()),12000)}
  catch(err){console.error(err);store=null;loadErr=true;authReady=true;renderAuth();render();return}  // Firebase unreachable: show a retry state instead of a frozen page
  if(store.demo)$('banner').classList.remove('hidden');
  applyLang();
  store.onAuth(u=>{authReady=true;me=u;unLikes();myLikes=new Set();unLikes=u?(store.subscribeLikes(u.uid,s=>{myLikes=s;render()})||(()=>{})):()=>{};renderAuth();render()});
  startFeed();store.subscribeVerified(s=>{verified=s;render()});refreshStats();route();
  setTimeout(()=>{if(!loaded){loadErr=true;render()}},12000);
})();
</script>
</body>
</html>
