function pitch(f,plat,title){

function patchGrid(parts){

    raf=requestAnimationFrame(()=>{const r=c.getBoundingClientRect(),x=(x0-r.left)/r.width,y=(y0-r.top)/r.height;
      c.style.setProperty('--ry',((x-.5)*14).toFixed(2)+'deg');c.style.setProperty('--rx',((.5-y)*11).toFixed(2)+'deg');c.style.setProperty('--mx',(x*100).toFixed(1)+'%');c.style.setProperty('--my',(y*100).toFixed(1)+'%')})});
  G.addEventListener('pointerout',e=>{const c=e.target.closest('.card');if(c&&!c.contains(e.relatedTarget))reset(c)})}
try{const c=JSON.parse(localStorage.getItem('tk_feed')||'null');if(c&&c.posts&&c.posts.length){posts=c.posts;loaded=true}}catch(e){}   // show the last feed instantly, refresh in the background
route();applyLang();   // paint the page immediately — never wait for the network
(async()=>{
  try{store=await withTimeout(live?firebaseStore(FIREBASE_CONFIG):Promise.resolve(demoStore()),25000)}
  catch(err){console.error(err);store=null;loadErr=true;authReady=true;renderAuth();render();return}  // Firebase unreachable: show a retry state instead of a frozen page
  if(store.demo)$('banner').classList.remove('hidden');
  applyLang();
  store.onAuth(u=>{authReady=true;me=u;unLikes();myLikes=new Set();unLikes=u?(store.subscribeLikes(u.uid,s=>{myLikes=s;render()})||(()=>{})):()=>{};
    unRep();reports=[];unRep=u&&u.isAdmin&&store.subscribeReports?(store.subscribeReports(l=>{reports=l;renderAuth();renderReports()})||(()=>{})):()=>{};
    if(u&&u.photo&&store.syncPhoto)syncMyPhoto(u);
    unSaves();mySaves=new Set();savesReady=false;if(!u&&savedMode)savedPosts=[];
    unSaves=u?(store.subscribeSaves(u.uid,v=>{mySaves=v;savesReady=true;render();if(savedMode)loadSaved()})||(()=>{})):()=>{};
    renderAuth();render()});
  startFeed();store.subscribeVerified(s=>{verified=s;render();ensurePros();if(proOnly)startFeed(true)});route();
  store.subscribeChallenge(c=>{challenge=c;unEnt();unEnt=()=>{};chalEntries=[];if(c)unEnt=store.subscribeEntries(c.id,l=>{chalEntries=l;renderFeat()})||(()=>{});updateChalRow();renderFeat()});
  store.lastWinner().then(w=>{lastWinner=w;renderFeat()}).catch(()=>{});
  setTimeout(()=>{if(!loaded){slow=true;render()}},6000);
  setTimeout(()=>{if(!loaded){loadErr=true;render()}},25000);
  setTimeout(()=>{if(!authReady){authReady=true;renderAuth()}},4000);   // never leave the header spinning
})();
