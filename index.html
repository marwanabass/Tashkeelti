<!DOCTYPE html>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>

 --cut:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,20px 100%,0 calc(100% - 20px))}
body{background:var(--bg);color:#eef1f6;font-family:Cairo,system-ui,sans-serif;min-height:100vh;
 background-image:radial-gradient(900px 340px at 85% -120px,rgba(52,211,153,.07),transparent),radial-gradient(800px 340px at 5% -120px,rgba(31,178,122,.07),transparent)}
.d{font-family:'Barlow Condensed',Impact,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase}
.btn{font-weight:700;padding:.6rem 1.1rem;border-radius:.75rem;transition:transform .15s,box-shadow .2s;white-space:nowrap;cursor:pointer;border:0}
.btn:focus-visible,.chip:focus-visible,.f:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
.neon{background:var(--neon);color:#04170f}.neon:hover{box-shadow:0 6px 18px rgba(52,211,153,.28);transform:translateY(-1px)}
.gold{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#04170f}.gold:hover{box-shadow:0 6px 18px rgba(31,178,122,.28);transform:translateY(-1px)}
.ghost{background:var(--s2);border:1px solid var(--line)}.ghost:hover{border-color:var(--gold)}
.f{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:.6rem;padding:.6rem .8rem;color:inherit;font:inherit}
.f:focus{outline:0;border-color:var(--neon);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#04170f;display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.chip{border:1px solid var(--line);background:var(--s1);padding:.35rem 1rem;cursor:pointer;white-space:nowrap;font-size:1.05rem;transition:all .15s;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.chip:hover{border-color:var(--gold)}.chip.on{background:var(--gold);color:#04170f;border-color:var(--gold)}
.card{background:linear-gradient(135deg,var(--gold),#16352a 35%,#18231e 65%,var(--gold));clip-path:var(--cut);padding:1px;transition:transform .2s,filter .2s}
.card:hover{transform:translateY(-3px);filter:drop-shadow(0 12px 22px rgba(52,211,153,.14))}
.in{background:var(--s1);clip-path:var(--cut);display:flex;flex-direction:column;height:100%}
.shot{position:relative;aspect-ratio:16/10;background:#07130d;display:block;width:100%;cursor:zoom-in;border:0;padding:0}
.shot>img,.shot>svg{width:100%;height:100%;object-fit:cover;display:block}
.fm{position:absolute;inset-inline-start:0;top:14px;padding:3px 18px 3px 12px;font-size:25px;line-height:1.1;background:linear-gradient(90deg,var(--gold2),var(--gold));color:#04170f;clip-path:polygon(0 0,100% 0,calc(100% - 10px) 100%,0 100%)}
[dir=rtl] .fm{padding:3px 12px 3px 18px;clip-path:polygon(0 0,100% 0,100% 100%,10px 100%)}
.code{background:#070b09;border:1px dashed #2a3a33;border-radius:.6rem;padding:.5rem .75rem;font:600 14px ui-monospace,Menlo,monospace;color:var(--gold2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:start}
dialog{background:var(--s1);color:#eef1f6;border:1px solid var(--line);border-radius:1.1rem;padding:0;width:min(480px,94vw);max-height:92vh;box-shadow:0 20px 70px rgba(0,0,0,.65)}
.vb{color:var(--blue);font-size:.95em;margin-inline-start:.3rem;filter:drop-shadow(0 0 4px rgba(74,163,255,.45))}
.lk.on{color:#ff7a93;border-color:#ff7a93}
.ic{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.17em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.solid path{fill:currentColor}.ic-badge circle{fill:currentColor;stroke:none}.ic-badge path{stroke:#fff}.ic-crown{fill:rgba(255,255,255,.18)}
.zoom{position:absolute;inset-inline-end:10px;bottom:10px;background:rgba(0,0,0,.55);border-radius:8px;padding:3px 8px;font-size:12px;color:#fff}
dialog::backdrop{background:rgba(0,0,0,.82)}
dialog form,dialog .box{padding:1.3rem;display:grid;gap:.9rem}
label.l{display:block;font-size:.78rem;color:var(--mute);margin-bottom:.2rem}
.err{color:#ff8b8b;font-size:.85rem;min-height:1.1rem}
#toast{position:fixed;inset-inline:0;margin:auto;width:max-content;bottom:calc(22px + env(safe-area-inset-bottom,0px));background:var(--neon);color:#031a0d;font-weight:700;padding:.6rem 1.4rem;border-radius:.75rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<body style="padding-top:env(safe-area-inset-top,0px)">

<header class="sticky top-0 z-10 border-b border-[var(--line)] bg-[#070a09]/90 backdrop-blur" style="top:env(safe-area-inset-top,0px)">
  <div class="mx-auto flex max-w-6xl flex-wrap items-center gap-3 px-4 py-3">
    <div class="d text-3xl leading-none text-transparent bg-clip-text" style="background-image:linear-gradient(90deg,var(--gold2),var(--gold))">Tashkeelti</div>
    <label class="relative order-last w-full sm:order-none sm:w-auto sm:flex-1">
      <i class="fa-solid fa-magnifying-glass pointer-events-none absolute top-1/2 -translate-y-1/2 text-[var(--mute)] start-3"></i>
      <input id="q" type="search" class="f ps-9" data-ph="search" aria-label="Search">
    </label>
    <div class="ms-auto flex items-center gap-2 sm:ms-0">
      <button id="langBtn" class="btn ghost" aria-label="Language"></button>
      <span id="auth" class="flex items-center gap-2"></span>
    </div>
  </div>
</header>

<main class="mx-auto max-w-6xl px-4">
  <section class="pt-8 pb-2">
    <h1 class="d text-4xl leading-none sm:text-6xl"><span data-i="h1"></span><br><span class="text-[var(--neon)]" data-i="h2"></span></h1>
    <p class="mt-3 max-w-xl text-[var(--mute)]" data-i="sub"></p>
    <div id="banner" class="mt-4 hidden rounded-xl border border-[#1f5a41] bg-[#0d2a1f] px-4 py-2 text-sm text-[#bdf3d9]"></div>
  </section>
  <div class="flex items-center gap-3"><nav id="rail" class="flex min-w-0 flex-1 gap-2 overflow-x-auto py-4" style="scrollbar-width:none" aria-label="Formations"></nav><label class="flex items-center gap-2 text-[var(--mute)]"><i class="fa-solid fa-arrow-down-wide-short"></i><select id="sort" class="f !w-auto" aria-label="Sort"><option value="new" data-i="sNew"></option><option value="top" data-i="sTop"></option></select></label></div>
  <section id="grid" class="grid gap-5 pb-20" style="grid-template-columns:repeat(auto-fill,minmax(300px,1fr))" aria-live="polite"></section>
</main>

<!-- Profile / first-time handle setup -->
<dialog id="prDlg"><form id="prForm">
  <h2 class="d text-3xl text-[var(--gold2)]"><i class="fa-solid fa-user-pen"></i> <span data-i="profile"></span></h2>
  <div><label class="l" for="prH"><i class="fa-solid fa-at"></i> <span data-i="handleLbl"></span></label><input id="prH" class="f" dir="ltr" maxlength="16" pattern="[A-Za-z0-9_]{3,16}" placeholder="@username"></div>
  <div><label class="l" for="prN"><i class="fa-solid fa-id-card"></i> <span data-i="nameLbl"></span></label><input id="prN" class="f" maxlength="30"></div>
  <div><label class="l" for="prB"><i class="fa-solid fa-pen"></i> <span data-i="bioLbl"></span></label><input id="prB" class="f" maxlength="100"></div>
  <p class="err" id="prE"></p>
  <div class="flex justify-between gap-2"><button type="button" id="outBtn" class="btn ghost"><i class="fa-solid fa-right-from-bracket"></i> <span data-i="signout"></span></button><button class="btn gold" type="submit"><i class="fa-solid fa-floppy-disk"></i> <span data-i="save"></span></button></div>
</form></dialog>

<!-- Share tactics -->
<dialog id="pDlg"><form id="pForm">
  <h2 class="d text-3xl text-[var(--gold2)]"><i class="fa-solid fa-futbol"></i> <span data-i="shareT"></span></h2>
  <div><label class="l" for="pF"><i class="fa-solid fa-diagram-project"></i> <span data-i="formation"></span></label><input id="pF" class="f" dir="ltr" list="fl" required pattern="\d(-\d){1,4}" placeholder="4-2-3-1"><datalist id="fl"></datalist></div>
  <div><label class="l" for="pC"><i class="fa-solid fa-key"></i> <span data-i="code"></span></label><input id="pC" class="f" dir="ltr" required maxlength="40" placeholder="e8%&amp;M#k9P" autocomplete="off"></div>
  <div><label class="l" for="pI"><i class="fa-solid fa-image"></i> <span data-i="shot"></span></label><input id="pI" type="file" accept="image/*" class="f"></div>
  <div><label class="l" for="pU"><i class="fa-solid fa-link"></i> <span data-i="orUrl"></span></label><input id="pU" type="url" dir="ltr" class="f" placeholder="https://..."></div>
  <p class="err" id="pE"></p>
  <div class="flex justify-end gap-2"><button type="button" class="btn ghost" id="pCancel"><i class="fa-solid fa-xmark"></i> <span data-i="cancel"></span></button><button class="btn gold" id="pGo" type="submit"><i class="fa-solid fa-paper-plane"></i> <span data-i="publish"></span></button></div>
</form></dialog>

<!-- Admin panel -->
<dialog id="adDlg"><div class="box">
  <h2 class="d text-3xl text-[var(--gold2)]"><i class="fa-solid fa-crown"></i> <span data-i="admin"></span></h2>
  <p class="text-sm text-[var(--mute)]" data-i="adminHint"></p>
  <input id="adH" class="f" dir="ltr" placeholder="@ProPlayer">
  <p class="err" id="adE"></p>
  <div class="flex gap-2"><button id="grant" class="btn neon flex-1"><i class="fa-solid fa-circle-check"></i> <span data-i="grant"></span></button><button id="revoke" class="btn ghost flex-1"><i class="fa-solid fa-ban"></i> <span data-i="revoke"></span></button></div>
</div></dialog>

<dialog id="big" style="width:min(1000px,96vw);background:#000"><img alt="" style="width:100%;display:block"></dialog>
<div id="toast" role="status"></div>

      await b.commit();await load(auth.currentUser)},
    subscribe(f){F.onSnapshot(F.query(F.collection(fs,'tactics'),F.orderBy('at','desc'),F.limit(80)),
      s=>f(s.docs.map(d=>{const x=d.data();return{id:d.id,...x,at:x.at&&x.at.toMillis?x.at.toMillis():Date.now()}})))},
    subscribeVerified(f){F.onSnapshot(F.query(F.collection(fs,'handles'),F.where('isVerified','==',true)),s=>f(new Set(s.docs.map(d=>d.id))))},
    add:p=>F.addDoc(F.collection(fs,'tactics'),{...p,likeCount:0,at:F.serverTimestamp()}),
    async toggleLike(u,p,on){const b=F.writeBatch(fs),lr=F.doc(fs,'likes',p.id+'_'+u.uid),tr=F.doc(fs,'tactics',p.id);
      if(on){b.set(lr,{pid:p.id,uid:u.uid});b.update(tr,{likeCount:F.increment(1)})}else{b.delete(lr);b.update(tr,{likeCount:F.increment(-1)})}await b.commit()},
    subscribeLikes:(uid,f)=>F.onSnapshot(F.query(F.collection(fs,'likes'),F.where('uid','==',uid)),s=>f(new Set(s.docs.map(d=>d.data().pid)))),
    remove:id=>F.deleteDoc(F.doc(fs,'tactics',id)),
    async setVerified(h,v){const r=F.doc(fs,'handles',h.toLowerCase());
      if(!(await F.getDoc(r)).exists())throw new Error('nouser');await F.updateDoc(r,{isVerified:v})}};
}

/* ---------------- Rendering ---------------- */
function pitch(f){const rows=[1,...f.split('-').map(Number)],d=[];
  rows.forEach((n,i)=>{const x=14+i*(132/(rows.length-1));for(let k=0;k<n;k++)d.push(`<circle cx="${x.toFixed(1)}" cy="${((k+1)*100/(n+1)).toFixed(1)}" r="4.5" fill="#34d399"/>`)});
  return`<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="160" height="100" fill="#0b1f14"/><g fill="none" stroke="#1fb27a" stroke-opacity=".35"><rect x="4" y="4" width="152" height="92"/><line x1="80" y1="4" x2="80" y2="96"/><circle cx="80" cy="50" r="14"/></g>${d.join('')}</svg>`}
function render(){
  const q=$('q').value.trim().toLowerCase();
  let l=posts.filter(p=>!fFilter||p.formation===fFilter);
  if(q)l=l.filter(p=>q[0]==='@'?p.handle.includes(q.slice(1)):[p.formation,p.handle,(p.displayName||'').toLowerCase(),(p.code||'').toLowerCase()].some(s=>s.includes(q)));
  if($('sort').value==='top')l=[...l].sort((a,b)=>(b.likeCount||0)-(a.likeCount||0));
  $('grid').innerHTML=l.length?l.map(p=>`<article class="card"><div class="in">
    <button class="shot" data-img="${esc(p.id)}">${okImg(p.img)?`<img loading="lazy" referrerpolicy="no-referrer" src="${esc(p.img)}" alt="${esc(p.formation)}">`:pitch(p.formation)}<span class="fm d">${esc(p.formation)}</span><span class="zoom"><i class="fa-solid fa-expand"></i></span></button>
    <div class="flex flex-1 flex-col gap-3 p-4">
      <div class="flex items-center justify-between gap-2">
        <button class="flex min-w-0 items-center gap-2 text-start font-bold hover:text-[var(--neon)]" data-user="${esc(p.handle)}"><span class="av">${esc(p.handle[0].toUpperCase())}</span>
          <span class="min-w-0"><span dir="ltr" class="block truncate">@${esc(p.handle)}${verified.has(p.handle)?`<i class="fa-solid fa-circle-check vb" title="${t('verified')}"></i>`:''}</span>${p.displayName?`<span class="block truncate text-xs font-medium text-[var(--mute)]">${esc(p.displayName)}</span>`:''}</span></button>
        <span class="text-xs text-[var(--mute)]"><i class="fa-regular fa-clock"></i> ${ago(p.at)}</span></div>
      <div class="code"><i class="fa-solid fa-key" style="opacity:.55;margin-inline-end:.5rem"></i>${esc(p.code)}</div>
      <div class="mt-auto flex gap-2"><button class="btn neon flex-1" data-copy="${esc(p.id)}"><i class="fa-regular fa-copy"></i> ${t('copy')}</button>
        <button class="btn ghost lk ${myLikes.has(p.id)?'on':''}" data-like="${esc(p.id)}" aria-pressed="${myLikes.has(p.id)}" aria-label="Like"><i class="fa-${myLikes.has(p.id)?'solid':'regular'} fa-heart"></i> ${p.likeCount||0}</button>
        ${me&&(p.uid===me.uid||me.isAdmin)?`<button class="btn ghost" data-del="${esc(p.id)}" aria-label="Delete"><i class="fa-solid fa-trash"></i></button>`:''}</div>
    </div></div></article>`).join('')
  :`<div class="col-span-full rounded-2xl border border-dashed border-[var(--line)] py-14 text-center text-[var(--mute)]"><i class="fa-solid fa-futbol mb-2 block text-3xl"></i><b class="d mb-1 block text-3xl text-white">${t('none')}</b>${t('noneSub')}</div>`;
}
const renderRail=()=>{$('rail').innerHTML=['',...FORMATIONS].map(f=>`<button class="chip d ${f===fFilter?'on':''}" data-f="${f}">${f||`<i class="fa-solid fa-layer-group"></i> ${t('all')}`}</button>`).join('')};
function renderAuth(){
  $('auth').innerHTML=me?`${me.isAdmin?`<button class="btn gold" id="adBtn" title="${t('admin')}"><i class="fa-solid fa-crown"></i> <span class="hidden sm:inline">${t('admin')}</span></button>`:''}
    <button class="btn gold" id="newBtn"><i class="fa-solid fa-plus"></i> <span class="hidden sm:inline">${t('share')}</span></button>
    <button class="av" id="meBtn" style="width:40px;height:40px;border:0;cursor:pointer" aria-label="${t('profile')}">${me.photo?`<img src="${esc(me.photo)}" alt="">`:esc((me.handle||me.displayName||'?')[0].toUpperCase())}</button>`
    :`<button class="btn gold" id="inBtn"><i class="fa-brands fa-google"></i> <span class="hidden sm:inline">${t('signin')}</span></button>`}
function applyLang(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';localStorage.setItem('tk_lang',lang);
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
  $('langBtn').innerHTML='<i class="fa-solid fa-globe"></i> '+(lang==='ar'?'EN':'عربي');
  renderAuth();renderRail();render()}

/* ---------------- Events ---------------- */
const openProfile=()=>{$('prH').value=me.handle||'';$('prH').disabled=!!me.handle;$('prH').required=!me.handle;$('prN').value=me.displayName;$('prB').value=me.bio;$('prE').textContent='';$('prDlg').showModal()};
document.addEventListener('click',async e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.id==='langBtn'){lang=lang==='ar'?'en':'ar';applyLang()}
  else if(b.id==='inBtn'){try{await store.login()}catch(x){toast(t('failed'))}}
  else if(b.id==='meBtn')openProfile();
  else if(b.id==='outBtn'){if(confirm(t('out'))){$('prDlg').close();store.logout()}}
  else if(b.id==='newBtn')me.handle?$('pDlg').showModal():openProfile();
  else if(b.id==='adBtn'){$('adE').textContent='';$('adDlg').showModal()}
  else if(b.closest('#rail')){fFilter=b.dataset.f;renderRail();render()}
  else if(b.dataset.user){$('q').value='@'+b.dataset.user;render();scrollTo({top:0,behavior:'smooth'})}
  else if(b.dataset.copy){const p=posts.find(x=>x.id===b.dataset.copy),ok=await copy(p.code),old=b.innerHTML;b.textContent=ok?t('copied'):t('failed');setTimeout(()=>b.innerHTML=old,1500);if(ok)toast(t('copyDone'))}
  else if(b.dataset.like){if(!me)return toast(t('loginLike'));const p=posts.find(x=>x.id===b.dataset.like);try{await store.toggleLike(me,p,!myLikes.has(p.id))}catch(x){toast(t('failed'))}}
  else if(b.dataset.del){if(confirm(t('del')))store.remove(b.dataset.del)}
  else if(b.dataset.img){const p=posts.find(x=>x.id===b.dataset.img);if(p&&okImg(p.img)){$('big').querySelector('img').src=p.img;$('big').showModal()}}
});
$('big').onclick=()=>$('big').close();$('q').oninput=render;$('sort').onchange=render;$('pCancel').onclick=()=>$('pDlg').close();
$('prForm').onsubmit=async e=>{e.preventDefault();$('prE').textContent='';
  const h=$('prH').value.replace(/^@/,'');if(!me.handle&&!/^[A-Za-z0-9_]{3,16}$/.test(h)){$('prE').textContent=t('bad');return}
  try{const had=!!me.handle;await store.saveProfile(me,{handle:h,displayName:$('prN').value.trim(),bio:$('prB').value.trim()});$('prDlg').close();if(!had)$('pDlg').showModal()}
  catch(x){$('prE').textContent=t(x.message)==x.message?t('failed'):t(x.message)}};
const shrink=f=>new Promise((ok,no)=>{const im=new Image();im.onload=()=>{const k=Math.min(1,900/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.onerror=no;im.src=URL.createObjectURL(f)});
$('pForm').onsubmit=async e=>{e.preventDefault();const g=$('pGo');g.disabled=true;$('pE').textContent='';
  try{const f=$('pI').files[0],u=$('pU').value.trim();let img=f?await shrink(f):u;
    if(!/^(data:image\/|https:\/\/)/.test(img))throw new Error('needImg');if(img.length>850000)throw new Error('big');
    await store.add({uid:me.uid,handle:me.handle,displayName:me.displayName,formation:$('pF').value.trim(),code:$('pC').value.trim(),img});
    $('pForm').reset();$('pDlg').close();toast(t('done'))}
  catch(x){$('pE').textContent=t(x.message)==x.message?t('failed'):t(x.message)}g.disabled=false};
for(const [id,v] of [['grant',true],['revoke',false]])$(id).onclick=async()=>{$('adE').textContent='';
  try{await store.setVerified($('adH').value.trim().replace(/^@/,''),v);toast(t('done'))}catch(x){$('adE').textContent=t(x.message)==x.message?t('failed'):t(x.message)}};

/* ---------------- Boot ---------------- */
$('fl').innerHTML=FORMATIONS.map(f=>`<option value="${f}">`).join('');
try{store=await firebaseStore(FIREBASE_CONFIG)}catch(err){console.error(err)}
applyLang();
store.onAuth(u=>{me=u;unLikes();myLikes=new Set();unLikes=u?(store.subscribeLikes(u.uid,s=>{myLikes=s;render()})||(()=>{})):()=>{};renderAuth();render();if(u&&!u.handle&&!$('prDlg').open)openProfile()});
store.subscribe(l=>{posts=l;render()});store.subscribeVerified(s=>{verified=s;render()});
</script>
</body>
</html>
