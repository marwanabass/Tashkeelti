<style>

body{background:var(--bg);color:#eef1f6;font-family:Cairo,system-ui,sans-serif;min-height:100vh;margin:0;
 background-image:radial-gradient(900px 340px at 85% -120px,rgba(52,211,153,.07),transparent),radial-gradient(800px 340px at 5% -120px,rgba(31,178,122,.07),transparent)}
.d{font-family:'Barlow Condensed',Impact,sans-serif;font-style:italic;font-weight:800;text-transform:uppercase}
.btn{font-weight:700;padding:.5rem 1rem;border-radius:.75rem;transition:transform .15s,box-shadow .2s;white-space:nowrap;cursor:pointer;border:0;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:focus-visible,.chip:focus-visible,.f:focus-visible{outline:2px solid var(--neon);outline-offset:2px}

.ghost{background:var(--s2);border:1px solid var(--line);color:#eef1f6}.ghost:hover{border-color:var(--gold)}
.f{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:.6rem;padding:.6rem .8rem;color:inherit;font:inherit}
.f:focus{outline:0;border-color:var(--neon);box-shadow:0 0 0 3px rgba(52,211,153,.18)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--gold2),var(--gold));color:#04170f;display:grid;place-items:center;font-weight:700;font-size:13px;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}
.chip{border:1px solid var(--line);background:var(--s1);padding:.35rem 1rem;cursor:pointer;white-space:nowrap;font-size:1.05rem;transition:all .15s}
.chip:hover{border-color:var(--gold)}.chip.on{background:var(--gold);color:#04170f;border-color:var(--gold)}
dialog{background:var(--s1);color:#eef1f6;border:1px solid var(--line);border-radius:1.1rem;padding:0;width:min(480px,94vw);max-height:92vh;box-shadow:0 20px 70px rgba(0,0,0,.65)}
.vb{color:var(--blue);font-size:.95em;margin-inline-start:.3rem}
.lk.on{color:#ff7a93;border-color:#ff7a93}
.ic{width:1.1em;height:1.1em;display:inline-block;vertical-align:-.17em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

dialog::backdrop{background:rgba(0,0,0,.82)}
dialog form,dialog .box{padding:1.3rem;display:grid;gap:.9rem}
label.l{display:block;font-size:.78rem;color:var(--mute);margin-bottom:.2rem}
.err{color:#ff8b8b;font-size:.85rem;min-height:1.1rem}

#toast.on{opacity:1}

.hidden{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.topbar{position:sticky;top:0;z-index:10;background:rgba(7,10,9,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.logo{font-size:28px;line-height:1;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.search-box{flex:1;max-width:400px;position:relative}
.search-box input{padding:.6rem 1rem;padding-inline-start:38px;border-radius:999px;background:#0b110f}
.search-box .ic{position:absolute;top:50%;inset-inline-start:12px;transform:translateY(-50%);color:var(--mute)}
.auth-area{display:flex;align-items:center;gap:8px}

.hero{position:relative;padding:32px 0 12px}
.hp{position:absolute;inset-inline-end:0;top:10px;width:240px;opacity:.1;stroke:var(--neon);fill:none;stroke-width:1.5;pointer-events:none}
.hero h1{font-size:clamp(36px,8vw,64px);line-height:1;margin:0}
.hero em{font-style:inherit;color:var(--neon)}
.sub{color:var(--mute);margin-top:10px;max-width:540px;font-size:15px}
.stats{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:14px;padding:8px 16px;display:flex;align-items:baseline;gap:8px}
.stat b{font-size:24px;background:linear-gradient(90deg,var(--gold2),var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}

.rail{display:flex;gap:8px;overflow-x:auto;padding:16px 0;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}
.meta{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 16px;color:var(--mute);font-size:14px}
.sortb select{width:auto;min-width:130px;padding:.4rem .8rem}

#grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));padding-bottom:100px}
.card{border-radius:20px;background:linear-gradient(180deg,#101a16,#0a100e);border:1px solid var(--line);overflow:hidden;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:rgba(52,211,153,.4)}
.shot{position:relative;display:block;width:100%;aspect-ratio:16/11;background:#07130d;border:0;padding:0;cursor:zoom-in;overflow:hidden}
.shot>img,.shot>svg{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.fm{position:absolute;z-index:2;top:10px;inset-inline-start:10px;padding:2px 12px;font-size:18px;border-radius:999px;background:rgba(7,10,9,.8);border:1px solid rgba(52,211,153,.5);color:var(--neon)}
.zoom{position:absolute;z-index:2;inset-inline-end:10px;top:10px;background:rgba(7,10,9,.6);border-radius:8px;padding:4px 6px;font-size:12px;color:#fff}
.cb{padding:14px;display:flex;flex-direction:column;gap:10px}
.ur{display:flex;align-items:center;justify-content:space-between}
.u{display:flex;align-items:center;gap:8px;background:none;border:0;color:inherit;cursor:pointer;padding:0;font:inherit}
.un{font-weight:700;direction:ltr;font-size:14px;display:flex;align-items:center}
.dn{font-size:11px;color:var(--mute)}
.tk{display:flex;align-items:center;gap:8px;background:#070b09;border:1px dashed #2f4a3f;border-radius:10px;padding:8px 12px;color:var(--mute)}
.tk span{font:600 14px monospace;color:var(--gold2);direction:ltr}
.ac{display:flex;gap:6px}.ac .cp{flex:1}

.fab{position:fixed;z-index:15;inset-inline-end:20px;bottom:24px;width:56px;height:56px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;font-size:20px;color:#04170f;background:linear-gradient(135deg,var(--gold2),var(--gold));box-shadow:0 10px 25px rgba(31,178,122,.4)}
.empty{grid-column:1/-1;text-align:center;padding:48px 12px;border:1px dashed var(--line);border-radius:16px;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:8px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.tab{border:0;background:none;color:var(--mute);padding:.5rem;border-radius:8px;font:700 0.9rem Cairo,sans-serif;cursor:pointer}
.tab.on{background:linear-gradient(135deg,var(--gold2),var(--gold));color:#04170f}

<button id="fab" class="fab" aria-label="Share tactics"><i class="fa-solid fa-plus ic"></i></button>

<!-- Profile / setup dialog -->
<dialog id="prDlg"><form id="prForm">

  <div><label class="l">اسم المستخدم @</label><input id="prH" class="f" dir="ltr" maxlength="16" placeholder="@username"></div>

<!-- Admin dialog -->
<dialog id="adDlg"><div class="box">

</div></dialog>

    <button type="button" class="tab on" id="tIn">دخول</button>

  </div>

</form></dialog>

<dialog id="fDlg"><div class="p-4"><div class="flex justify-between items-center mb-3"><h2 class="d text-xl text-[var(--gold2)]">كل الخطط</h2><button class="btn ghost sm" id="fClose">✕</button></div><div id="fBody" class="grid grid-cols-2 sm:grid-cols-3 gap-2"></div></div></dialog>
<dialog id="big" style="background:#000"><img alt="" style="width:100%"></dialog>
<div id="toast" role="status"></div>

<script type="module">
const FIREBASE_CONFIG = {

 en:{h1:'Copy the tactics.',h2:'Win the match.',sub:'Tactic codes shared by real players. Pick a formation, copy the code, play.',search:'Search formation, @creator or code',all:'All',

  signin:'تسجيل الدخول',signout:'تسجيل الخروج',share:'شارك تكتيك',shareT:'شارك تكتيكك',profile:'ملفك الشخصي',handleLbl:'اسم المستخدم @',nameLbl:'الاسم المعروض',bioLbl:'نبذة',
  save:'حفظ',formation:'الخطة',code:'كود التكتيك',shot:'صورة',cancel:'إلغاء',publish:'نشر',

const FORMATIONS=['4-2-1-3','4-3-1-2','4-4-1-1','4-1-2-1-2 Narrow','4-3-3 Attack','4-3-3 Holding','4-2-3-1 Wide','4-4-2','4-1-2-1-2 Wide','4-2-3-1','4-3-3 Defend','4-3-2-1','4-1-4-1','4-2-2-2','4-4-2 Holding','4-3-3','4-2-4','4-1-3-2','4-5-1 Flat','4-5-1 Attack','3-5-2','5-2-1-2','3-4-1-2','5-3-2','3-4-2-1','5-2-3','5-4-1','3-4-3','3-1-4-2'];

let store,me=null,posts=[],verified=new Set(),fFilter='',myLikes=new Set(),unLikes=()=>{},loaded=false;

const toast=(m,ms=2200)=>{const e=$('toast');e.textContent=m;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),ms)};

const okImg=u=>/^(data:image\/|https:\/\/)/.test(u||'');

async function firebaseStore(cfg){
 const B='https://www.gstatic.com/firebasejs/10.12.2/';
 const [{initializeApp},A,F]=await Promise.all([import(B+'firebase-app.js'),import(B+'firebase-auth.js'),import(B+'firebase-firestore.js')]);
 const app=initializeApp(cfg),auth=A.getAuth(app);
 let fs;try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache()})}catch(e){fs=F.getFirestore(app)}
 const mapDoc=d=>{const x=d.data();return{id:d.id,...x,at:x.at&&x.at.toMillis?x.at.toMillis():Date.now()}};
 let cb=(),busy=false;
 const mail=h=>h+'@'+AUTH_DOMAIN;
 async function load(u){
  if(busy)return;
  if(!u)return cb(null);
  let d={};try{const s=await F.getDoc(F.doc(fs,'users',u.uid));d=s.exists()?s.data():{}}catch(e){}
  cb({uid:u.uid,handle:d.handle||null,displayName:d.displayName||d.handle||'',bio:d.bio||'',isAdmin:u.email===mail(ADMIN_HANDLE)});
 }
 return{
  onAuth(f){cb=f;A.onAuthStateChanged(auth,load)},
  async signIn(h,pw){await A.signInWithEmailAndPassword(auth,mail(h),pw)},
  async signUp(h,pw){
   busy=true;
   try{const u=(await A.createUserWithEmailAndPassword(auth,mail(h),pw)).user;
    const b=F.writeBatch(fs);b.set(F.doc(fs,'handles',h),{uid:u.uid,isVerified:false});b.set(F.doc(fs,'users',u.uid),{handle:h,displayName:h,bio:''});await b.commit()}
   finally{busy=false}
   await load(auth.currentUser)},
  logout:()=>A.signOut(auth),
  async saveProfile(u,p){
   const b=F.writeBatch(fs);b.set(F.doc(fs,'users',u.uid),{handle:u.handle,displayName:p.displayName,bio:p.bio},{merge:true});await b.commit();await load(auth.currentUser)},
  subscribe(f){return F.onSnapshot(F.query(F.collection(fs,'tactics'),F.orderBy('at','desc'),F.limit(80)),s=>f(s.docs.map(mapDoc)),()=>f([]))},
  subscribeVerified(f){return F.onSnapshot(F.query(F.collection(fs,'handles'),F.where('isVerified','==',true)),s=>f(new Set(s.docs.map(d=>d.id))),()=>f(new Set()))},
  add:p=>F.addDoc(F.collection(fs,'tactics'),{...p,likeCount:0,at:F.serverTimestamp()}),
  async toggleLike(u,p,on){const b=F.writeBatch(fs),lr=F.doc(fs,'likes',p.id+'_'+u.uid),tr=F.doc(fs,'tactics',p.id);
   if(on){b.set(lr,{pid:p.id,uid:u.uid});b.update(tr,{likeCount:F.increment(1)})}else{b.delete(lr);b.update(tr,{likeCount:F.increment(-1)})}await b.commit()},
  subscribeLikes:(uid,f)=>F.onSnapshot(F.query(F.collection(fs,'likes'),F.where('uid','==',uid)),s=>f(new Set(s.docs.map(d=>d.data().pid))),()=>f(new Set())),
  remove:id=>F.deleteDoc(F.doc(fs,'tactics',id)),
  async setVerified(h,v){const r=F.doc(fs,'handles',h.toLowerCase());if(!(await F.getDoc(r)).exists())throw new Error('nouser');await F.updateDoc(r,{isVerified:v})}
 };
}

 return`<svg viewBox="0 0 160 100" preserveAspectRatio="xMidYMid slice"><rect width="160" height="100" fill="#0b1f14"/><g fill="none" stroke="#1fb27a" stroke-opacity=".4"><rect x="4" y="4" width="152" height="92"/><line x1="80" y1="4" x2="80" y2="96"/><circle cx="80" cy="50" r="14"/></g><circle cx="80" cy="50" r="4.5" fill="#34d399"/></svg>`}

function renderStats(){
 $('sT').textContent=posts.length;
 $('sC').textContent=new Set(posts.map(p=>p.handle)).size;
 $('sF').textContent=new Set(posts.map(p=>p.formation)).size}

function render(){
 const q=$('q').value.trim().toLowerCase();
 let l=posts.filter(p=>!fFilter||p.formation===fFilter);
 if(q)l=l.filter(p=>q[0]==='@'?p.handle.includes(q.slice(1)):[p.formation.toLowerCase(),p.handle].some(s=>s.includes(q)));
 if($('sort').value==='top')l=[...l].sort((a,b)=>(b.likeCount||0)-(a.likeCount||0));
 
 $('count').textContent=l.length+' '+t('nTac');
 renderStats();

 if(!loaded){$('grid').innerHTML='<div class="empty">جاري التحميل...</div>';return;}

 $('grid').innerHTML=l.length?l.map(p=>`<article class="card">
  <button class="shot" data-img="${esc(p.id)}">${okImg(p.img)?`<img src="${esc(p.img)}" alt="">`:pitch(p.formation)}<span class="fm d">${esc(p.formation)}</span><span class="zoom">🔍</span></button>
  <div class="cb">
   <div class="ur">
    <button class="u" data-user="${esc(p.handle)}"><span class="av">${esc(p.handle[0].toUpperCase())}</span>
     <div><span dir="ltr" class="un">@${esc(p.handle)}${verified.has(p.handle)?'<span class="vb">✓</span>':''}</span><span class="dn">${esc(p.displayName||'')}</span></div></button>
    <span class="text-xs text-[var(--mute)]">${ago(p.at)}</span>
   </div>
   <div class="tk"><span>🔑 ${esc(p.code)}</span></div>
   <div class="ac">
    <button class="btn neon cp sm" data-copy="${esc(p.id)}">📋 ${t('copy')}</button>
    <button class="btn ghost lk sm ${myLikes.has(p.id)?'on':''}" data-like="${esc(p.id)}">❤️ ${p.likeCount||0}</button>
    ${me&&(p.uid===me.uid||me.isAdmin)?`<button class="btn ghost sm" data-del="${esc(p.id)}">🗑️</button>`:''}
   </div>
  </div></article>`).join('')
 :`<div class="empty"><b class="d">${t('none')}</b><span>${t('noneSub')}</span></div>`;
}

const renderRail=()=>{$('rail').innerHTML=['',...POP,'more'].map(f=>f==='more'?`<button class="chip d" id="moreF">📂 ${t('all')}</button>`:`<button class="chip d ${f===fFilter?'on':''}" data-f="${f}">${f||'الكل'}</button>`).join('')};

function renderAuth(){
 $('auth').innerHTML=me?`${me.isAdmin?`<button class="btn gold sm" id="adBtn">👑</button>`:''}
 <button class="btn ghost sm" id="prBtn"><span class="av" style="width:24px;height:24px;font-size:11px">${esc(me.handle?me.handle[0].toUpperCase():'U')}</span> @${esc(me.handle||'new')}</button>`
 :`<button class="btn neon sm" id="loginBtn">${t('signinS')}</button>`;
}

async function init(){
    try{ store = await firebaseStore(FIREBASE_CONFIG); }catch(e){}

    document.addEventListener('click', async e=>{
        if($('loginBtn')?.contains(e.target)) $('aDlg').showModal();
        if($('prBtn')?.contains(e.target)){ $('prH').value=me.handle||''; $('prN').value=me.displayName||''; $('prB').value=me.bio||''; $('prDlg').showModal(); }
        if($('adBtn')?.contains(e.target)) $('adDlg').showModal();
        if($('moreF')?.contains(e.target)){ $('fBody').innerHTML=FORMATIONS.map(f=>`<button class="btn ghost text-xs p-2" data-f="${f}">${f}</button>`).join(''); $('fDlg').showModal(); }

        const chip=e.target.closest('[data-f]');
        if(chip){ fFilter=chip.getAttribute('data-f'); renderRail(); render(); $('fDlg').close(); }

        const cpBtn=e.target.closest('[data-copy]');
        if(cpBtn){ const post=posts.find(p=>p.id===cpBtn.getAttribute('data-copy')); if(post&&await copyText(post.code)) toast(t('copyDone')); }

        const lkBtn=e.target.closest('[data-like]');
        if(lkBtn&&store){ if(!me){$('aDlg').showModal();return;} await store.toggleLike(me,posts.find(p=>p.id===lkBtn.getAttribute('data-like')),!myLikes.has(lkBtn.getAttribute('data-like'))); }

        const delBtn=e.target.closest('[data-del]');
        if(delBtn&&store&&confirm('حذف؟')) await store.remove(delBtn.getAttribute('data-del'));
    });

    $('q').addEventListener('input',()=>render());
    $('sort').addEventListener('change',()=>render());
    $('langBtn').addEventListener('click',()=>{
        lang=lang==='ar'?'en':'ar'; localStorage.setItem('tk_lang',lang);
        document.documentElement.lang=lang; document.documentElement.dir=lang==='ar'?'rtl':'ltr';
        renderRail(); render(); renderAuth();
    });

    $('fab').addEventListener('click',()=>{
        if(!me){$('aDlg').showModal();return;}
        if(!me.handle){$('prDlg').showModal();return;}
        $('pF').innerHTML=FORMATIONS.map(f=>`<option value="${f}">${f}</option>`).join('');
        $('pDlg').showModal();
    });

    $('pCancel').addEventListener('click',()=>$('pDlg').close());
    $('fClose').addEventListener('click',()=>$('fDlg').close());

    let authMode='in';
    $('tIn').addEventListener('click',()=>{authMode='in';$('tIn').classList.add('on');$('tUp').classList.remove('on');});
    $('tUp').addEventListener('click',()=>{authMode='up';$('tUp').classList.add('on');$('tIn').classList.remove('on');});

    $('aForm').addEventListener('submit',async e=>{
        e.preventDefault(); if(!store)return;
        try{
            if(authMode==='in') await store.signIn($('aU').value.trim().toLowerCase(), $('aP').value);
            else await store.signUp($('aU').value.trim().toLowerCase(), $('aP').value);
            $('aDlg').close(); toast('تم');
        }catch(err){$('aE').textContent=authMsg(err);}
    });

    $('prForm').addEventListener('submit',async e=>{
        e.preventDefault(); if(!store)return;
        await store.saveProfile(me,{displayName:$('prN').value,bio:$('prB').value});
        $('prDlg').close(); toast('تم الحفظ');
    });

    $('outBtn').addEventListener('click',async()=>{if(store)await store.logout();$('prDlg').close();});

    $('grant').addEventListener('click',async()=>{if(store)try{await store.setVerified($('adH').value,true);toast('تم');$('adDlg').close();}catch(e){$('adE').textContent='خطأ';}});
    $('revoke').addEventListener('click',async()=>{if(store)try{await store.setVerified($('adH').value,false);toast('تم');$('adDlg').close();}catch(e){$('adE').textContent='خطأ';}});

    if(store){
        store.onAuth(u=>{me=u;renderAuth();if(me)unLikes=store.subscribeLikes(me.uid,s=>{myLikes=s;render()});else{myLikes.clear();render();}});
        store.subscribe(d=>{posts=d;loaded=true;render();});
        store.subscribeVerified(v=>{verified=v;render();});
    }else{loaded=true;render();}

    renderRail(); renderAuth();
}
init();
</script>
</body>
</html>
